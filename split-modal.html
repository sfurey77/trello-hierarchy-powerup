<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Noto Sans, Ubuntu, Droid Sans, 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 8px 0;
      color: #172b4d;
    }

    .progress-container {
      background: #f4f5f7;
      border-radius: 4px;
      padding: 10px 12px;
      margin-bottom: 12px;
      border: 1px solid #dfe1e6;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #42526e;
    }

    .progress-bar-bg {
      background: #ebecf0;
      border-radius: 4px;
      height: 8px;
      width: 100%;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: #0052cc;
      border-radius: 4px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      background: #ffffff;
      border: 1px solid #dfe1e6;
      border-radius: 3px;
      font-size: 13px;
      transition: background 0.15s ease-in-out;
    }

    .item-row:hover {
      background: #f4f5f7;
    }

    .item-name {
      font-weight: 500;
      color: #172b4d;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70%;
    }

    .btn-split {
      background-color: #091e420f;
      color: #172b4d;
      border: none;
      border-radius: 3px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-split:hover {
      background-color: #091e4214;
      color: #0052cc;
    }

    .btn-split:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .btn-success {
      background-color: #e3fcef !important;
      color: #006644 !important;
    }
  </style>
</head>
<body>
  <div id="content">
    <div id="item-list"></div>
  </div>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./split-modal.js"></script>
</body>
</html>
