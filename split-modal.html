<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    body { 
      padding: 12px; 
      margin: 0; 
      overflow-y: auto;
    }
    #content {
      padding-bottom: 10px;
    }
    .item-btn {
      width: 100%;
      text-align: left;
      margin-bottom: 8px;
      padding: 8px 12px;
      cursor: pointer;
      background-color: #091e420f; /* Trello light gray */
      border: none;
      border-radius: 3px;
      font-weight: 500;
    }
    .item-btn:hover {
      background-color: #091e4224; /* Darker gray on hover */
    }
  </style>
</head>
<body>
  <div id="content">
    <p><strong>Select an item to split into a child card:</strong></p>
    <div id="item-list">Loading checklists...</div>
  </div>

  <script src="./split-modal.js"></script>
</body>
</html>
