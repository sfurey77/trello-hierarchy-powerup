<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Noto Sans, Ubuntu, Droid Sans, 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 4px 0;
      color: var(--ds-text, #b6c2cf);
      background-color: transparent;
    }

    .progress-container {
      background: var(--ds-background-neutral, #22272b);
      border-radius: 3px;
      padding: 6px 8px;
      margin-bottom: 6px;
      border: 1px solid var(--ds-border, #38414a);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--ds-text-subtle, #9fadbc);
    }

    .progress-bar-bg {
      background: var(--ds-background-neutral-hovered, #2c333a);
      border-radius: 3px;
      height: 6px;
      width: 100%;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 3px; /* Reduced gap between items */
    }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 6px; /* Tight padding to eliminate vertical waste */
      background: var(--ds-background-neutral, #22272b);
      border: 1px solid var(--ds-border, #38414a);
      border-radius: 3px;
      font-size: 12px;
    }

    .item-row:hover {
      background: var(--ds-background-neutral-hovered, #2c333a);
    }

    .item-name {
      font-weight: 400;
      color: var(--ds-text, #b6c2cf);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 72%;
    }

    .btn-split {
      background-color: var(--ds-background-neutral-bold, #a6c5e229);
      color: var(--ds-text, #b6c2cf);
      border: none;
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-split:hover {
      background-color: var(--ds-background-neutral-bold-hovered, #a6c5e23d);
      color: var(--ds-text-selected, #579dff);
    }

    .btn-split:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .btn-success {
      background-color: #1f845a !important;
      color: #ffffff !important;
    }
  </style>
</head>
<body>
  <div id="content">
    <div id="item-list"></div>
  </div>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./split-modal.js"></script>
</body>
</html>
