<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    body { 
      padding: 12px; 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Noto, sans-serif;
    }
    #content {
      width: 100%;
    }
    .item-btn {
      width: 100%;
      text-align: left;
      margin-bottom: 8px;
      padding: 8px 12px;
      cursor: pointer;
      background-color: #091e420f;
      border: none;
      border-radius: 3px;
      font-weight: 500;
      color: #172b4d;
    }
    .item-btn:hover {
      background-color: #091e4224;
    }
  </style>
</head>
<body>
  <div id="content">
    <div id="item-list">Loading checklist tasks...</div>
  </div>

  <script src="./split-modal.js"></script>
</body>
</html>
